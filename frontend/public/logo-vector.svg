<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" aria-label="Better Drive Logo">
  <defs>
    <!-- Warm Segment: Top-Left to Bottom-Left -->
    <linearGradient id="bd-warm" x1="0.45" y1="0.1" x2="0.15" y2="0.8">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="18%" stop-color="#F472B6" />
      <stop offset="42%" stop-color="#FB7185" />
      <stop offset="72%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>

    <!-- Green Segment: Bottom-Left across Base -->
    <linearGradient id="bd-green" x1="0.15" y1="0.75" x2="0.85" y2="0.75">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="28%" stop-color="#A3E635" />
      <stop offset="55%" stop-color="#4ADE80" />
      <stop offset="78%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Sky Blue Segment: Bottom-Right to Top-Right -->
    <linearGradient id="bd-blue" x1="0.85" y1="0.8" x2="0.5" y2="0.1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#60A5FA" />
      <stop offset="68%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Fold Crease Shadows -->
    <linearGradient id="bd-crease-left" x1="0.2" y1="0.65" x2="0.32" y2="0.78">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="bd-crease-right" x1="0.7" y1="0.68" x2="0.6" y2="0.78">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="bd-crease-top" x1="0.52" y1="0.16" x2="0.46" y2="0.28">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glass Rim Sheen -->
    <linearGradient id="bd-sheen" x1="0.3" y1="0.1" x2="0.7" y2="0.9">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.0" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <!-- Filter Drop Shadow -->
  <g style="filter: drop-shadow(0 2.5px 5px rgba(37,99,235,0.22));">
    <!-- Segment 1: Warm Left Loop -->
    <path
      d="M 50 14
         C 43 14 36 19 32 26
         L 16 54
         C 12 61 12 69 16 76
         C 20 83 28 86 36 86
         C 42 86 48 83 51 78
         L 57 68
         C 55 64 50 62 45 62
         L 37 62
         C 32 62 28 58 26 54
         L 38 34
         C 41 29 45 26 50 26
         C 53 26 56 27 58 29
         L 62 23
         C 58 17 54 14 50 14 Z"
      fill="url(#bd-warm)"
    />

    <!-- Segment 2: Green Base Loop -->
    <path
      d="M 36 86
         L 68 86
         C 76 86 84 83 88 76
         L 90 72
         C 87 68 83 66 78 66
         L 46 66
         C 41 66 37 69 34 74
         L 28 84
         C 30 85 33 86 36 86 Z"
      fill="url(#bd-green)"
    />

    <!-- Segment 3: Sky Blue Right Loop -->
    <path
      d="M 68 86
         C 76 86 84 83 88 76
         C 92 69 92 61 88 54
         L 72 26
         C 68 19 61 14 53 14
         L 50 14
         C 52 18 54 22 55 26
         L 68 50
         C 70 54 70 58 68 62
         L 62 72
         C 64 78 68 82 74 84
         L 68 86 Z"
      fill="url(#bd-blue)"
    />

    <!-- Depth Creases -->
    <path d="M 32 62 L 40 86 L 44 76 Z" fill="url(#bd-crease-left)" />
    <path d="M 62 66 L 70 86 L 66 72 Z" fill="url(#bd-crease-right)" />
    <path d="M 50 14 L 56 28 L 50 26 Z" fill="url(#bd-crease-top)" />

    <!-- Outer Rim Highlight -->
    <path
      d="M 50 14
         C 43 14 36 19 32 26
         L 16 54
         C 12 61 12 69 16 76
         C 20 83 28 86 36 86
         L 68 86
         C 76 86 84 83 88 76
         C 92 69 92 61 88 54
         L 72 26
         C 68 19 61 14 53 14 Z"
      stroke="url(#bd-sheen)"
      stroke-width="1.2"
      fill="none"
    />
  </g>
</svg>
